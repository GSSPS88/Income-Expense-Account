<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>income and expense account</title>
    <link rel="stylesheet" href="income-expenseAccount.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <h2>ໂປຣແກຣມບັນທຶກລາຍຮັບ-ລາຍຈ່າຍ</h2>
    <div class="container">
        <h4>ຍອດເງິນເຫຼືອ (LAK)</h4>
        <h1 id="balance">₭ 0.00</h1>
        <div class="income-expense-container">
            <div>
                <h4>ລາຍຮັບ</h4>
                <p id="money-plus" class="money-plus"></p>
            </div>
            <div>
                <h4>ລາຍຈ່າຍ</h4>
                <p id="money-minus" class="money-minus"></p>
            </div>
        </div>
        <h3>ປະຫວັດທຸລະກຳ</h3>
        <ul id="list" class="list"></ul>
        <h3>ເພີ່ມທຸລະກຳ</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">ຊື່ລາຍການ</label>
                <input type="text" id="text" placeholder="ລະບຸທຸລະກຳ">
            </div>
            <div class="form-control">
                <label for="amount">ຈຳນວນເງິນ <br> (+ ລາຍຮັບ, -ລາຍຈ່າຍ)</label>
                <input type="number" name="" id="amount" placeholder="ລະບຸຈຳນວນເງິນ">
            </div>
            <button class="btn">ເພີ່ມທຸລະກຳ</button>
        </form>
    </div>
    <script src="income-expenseAccount.js"></script>
</body>
</html>
